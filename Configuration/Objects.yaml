Sitegeist\Pandora\Infrastructure\FlowSessionStore:
  properties:
    metaDataCache:
      object:
        factoryObjectName: Neos\Flow\Cache\CacheManager
        factoryMethodName: getCache
        arguments:
          1:
            value: MCP_Session_MetaData
    storageCache:
      object:
        factoryObjectName: Neos\Flow\Cache\CacheManager
        factoryMethodName: getCache
        arguments:
          1:
            value: MCP_Session_Storage

Mcp\Server\Session\SessionStoreInterface:
  className: 'Sitegeist\Pandora\Infrastructure\FlowSessionStore'

Sitegeist\Pandora\McpServerBuilderFactory:
  arguments:
    1:
      setting: 'Sitegeist.Pandora.capabilities.discoveryPaths'
    2:
      object:
        factoryObjectName: Neos\Flow\Cache\CacheManager
        factoryMethodName: getSimpleCache
        arguments:
          1:
            value: MCP_Capabilities
